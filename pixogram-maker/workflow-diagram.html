<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixogram Workflow</title>
<style>
  body { margin: 0; background: #0d1117; display: flex; justify-content: center; padding: 40px 20px; }
</style>
</head>
<body>
<svg viewBox="0 0 720 1320" width="720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc8cff"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="40" text-anchor="middle" fill="#c9d1d9" font-size="22" font-weight="bold">Pixogram Workflow</text>
  <text x="350" y="62" text-anchor="middle" fill="#484f58" font-size="13">AI-driven creative pipeline for 24x24 pixel animations</text>

  <!-- Legend (top right) -->
  <rect x="505" y="80" width="180" height="72" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="520" y="94" width="10" height="10" rx="2" fill="#bc8cff"/>
  <text x="535" y="103" fill="#bc8cff" font-size="10">Workflow (Code)</text>
  <rect x="520" y="112" width="10" height="10" rx="2" fill="#d29922"/>
  <text x="535" y="121" fill="#d29922" font-size="10">AI Decision</text>
  <rect x="520" y="130" width="10" height="10" rx="2" fill="#3fb950"/>
  <text x="535" y="139" fill="#3fb950" font-size="10">AI Creative / Code</text>

  <!-- ================================================================== -->
  <!-- ENTRY: New Issue -->
  <!-- ================================================================== -->
  <rect x="250" y="100" width="200" height="40" rx="20" fill="none" stroke="#484f58" stroke-width="1.5"/>
  <text x="350" y="125" text-anchor="middle" fill="#c9d1d9" font-size="14">New GitHub Issue</text>

  <!-- Arrow -->
  <line x1="350" y1="140" x2="350" y2="172" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================================================================== -->
  <!-- GATE 1: Approval (pure code) -->
  <!-- ================================================================== -->
  <g transform="translate(350,210)">
    <polygon points="0,-34 70,0 0,34 -70,0" fill="#0d1117" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="0" y="-6" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">Approval</text>
    <text x="0" y="8" text-anchor="middle" fill="#bc8cff" font-size="10">Gate</text>
  </g>
  <!-- Annotations (right side) -->
  <rect x="435" y="188" width="38" height="14" rx="3" fill="#bc8cff" opacity="0.2"/>
  <text x="454" y="198" text-anchor="middle" fill="#bc8cff" font-size="8" font-weight="bold">CODE</text>
  <text x="480" y="199" fill="#8b949e" font-size="10">Admin author = auto-approve</text>
  <text x="480" y="213" fill="#8b949e" font-size="10">Others = wait for label</text>
  <!-- Label tag -->
  <rect x="435" y="219" width="120" height="16" rx="8" fill="#1a1e2a" stroke="#bc8cff" stroke-width="0.8"/>
  <text x="495" y="230" text-anchor="middle" fill="#bc8cff" font-size="9">pixogram-approved</text>

  <!-- Reject path (left) -->
  <line x1="280" y1="210" x2="195" y2="210" stroke="#484f58" stroke-width="1" stroke-dasharray="4"/>
  <text x="190" y="207" text-anchor="end" fill="#f85149" font-size="11">stop</text>

  <!-- Arrow down -->
  <line x1="350" y1="244" x2="350" y2="278" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================================================================== -->
  <!-- GATE 2: Safety Check -->
  <!-- ================================================================== -->
  <g transform="translate(350,316)">
    <polygon points="0,-34 70,0 0,34 -70,0" fill="#0d1117" stroke="#bc8cff" stroke-width="1.5" stroke-dasharray="4 2"/>
    <polygon points="0,-26 54,0 0,26 -54,0" fill="none" stroke="#d29922" stroke-width="1"/>
    <text x="0" y="-6" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">Safety</text>
    <text x="0" y="8" text-anchor="middle" fill="#d29922" font-size="10">Check</text>
  </g>
  <!-- Annotations -->
  <rect x="435" y="293" width="38" height="14" rx="3" fill="#bc8cff" opacity="0.2"/>
  <text x="454" y="303" text-anchor="middle" fill="#bc8cff" font-size="8" font-weight="bold">CODE</text>
  <text x="480" y="304" fill="#8b949e" font-size="10">Checks label first (cache)</text>
  <rect x="435" y="311" width="24" height="14" rx="3" fill="#d29922" opacity="0.2"/>
  <text x="447" y="321" text-anchor="middle" fill="#d29922" font-size="8" font-weight="bold">AI</text>
  <text x="465" y="322" fill="#8b949e" font-size="10">Classifies if no label yet</text>
  <!-- Label tags -->
  <rect x="435" y="331" width="142" height="16" rx="8" fill="#1a1e2a" stroke="#3fb950" stroke-width="0.8"/>
  <text x="506" y="342" text-anchor="middle" fill="#3fb950" font-size="9">pixogram-triage-passed</text>
  <rect x="584" y="331" width="128" height="16" rx="8" fill="#1a1e2a" stroke="#f85149" stroke-width="0.8"/>
  <text x="648" y="342" text-anchor="middle" fill="#f85149" font-size="9">pixogram-triage-failed</text>

  <!-- Reject path (left) -->
  <line x1="280" y1="316" x2="195" y2="316" stroke="#484f58" stroke-width="1" stroke-dasharray="4"/>
  <text x="190" y="313" text-anchor="end" fill="#f85149" font-size="11">stop</text>

  <!-- Arrow down -->
  <line x1="350" y1="350" x2="350" y2="395" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================================================================== -->
  <!-- LOOP CONTAINER -->
  <!-- ================================================================== -->
  <rect x="70" y="395" width="560" height="530" rx="12" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6"/>
  <text x="90" y="415" fill="#30363d" font-size="11" font-weight="bold">CREATIVE LOOP</text>

  <!-- ================================================================== -->
  <!-- TRIAGE (AI decision) -->
  <!-- ================================================================== -->
  <g transform="translate(350,462)">
    <polygon points="0,-35 80,0 0,35 -80,0" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Triage</text>
    <text x="0" y="10" text-anchor="middle" fill="#d29922" font-size="10">Who acts next?</text>
  </g>
  <!-- Annotations (above DONE line) -->
  <rect x="450" y="435" width="24" height="14" rx="3" fill="#d29922" opacity="0.2"/>
  <text x="462" y="445" text-anchor="middle" fill="#d29922" font-size="8" font-weight="bold">AI</text>
  <text x="480" y="446" fill="#8b949e" font-size="10">User comments = highest priority</text>

  <!-- DONE path (exits right, clearly below annotations) -->
  <line x1="430" y1="462" x2="555" y2="462" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="466" fill="#c9d1d9" font-size="12" font-weight="bold">DONE</text>
  <text x="480" y="478" fill="#8b949e" font-size="10">Respects max iterations</text>

  <!-- Branch lines from triage down -->
  <line x1="350" y1="497" x2="170" y2="540" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="497" x2="350" y2="540" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="497" x2="530" y2="540" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================================================================== -->
  <!-- VISIONARY -->
  <!-- ================================================================== -->
  <rect x="95" y="545" width="150" height="58" rx="25" fill="#1a2332" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="170" y="567" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Visionary</text>
  <text x="170" y="581" text-anchor="middle" fill="#8b949e" font-size="10">Big picture, emotions</text>
  <text x="170" y="594" text-anchor="middle" fill="#8b949e" font-size="10">Top-down direction</text>
  <rect x="208" y="547" width="24" height="14" rx="3" fill="#d29922" opacity="0.3"/>
  <text x="220" y="557" text-anchor="middle" fill="#d29922" font-size="8" font-weight="bold">AI</text>

  <!-- ================================================================== -->
  <!-- MAVERICK -->
  <!-- ================================================================== -->
  <rect x="275" y="545" width="150" height="58" rx="25" fill="#1a2332" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="567" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Maverick</text>
  <text x="350" y="581" text-anchor="middle" fill="#8b949e" font-size="10">Twist from details</text>
  <text x="350" y="594" text-anchor="middle" fill="#8b949e" font-size="10">Bottom-up surprise</text>
  <rect x="388" y="547" width="24" height="14" rx="3" fill="#d29922" opacity="0.3"/>
  <text x="400" y="557" text-anchor="middle" fill="#d29922" font-size="8" font-weight="bold">AI</text>

  <!-- ================================================================== -->
  <!-- CRAFTSMAN -->
  <!-- ================================================================== -->
  <rect x="455" y="545" width="150" height="58" rx="25" fill="#1a2332" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="530" y="567" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="bold">Craftsman</text>
  <text x="530" y="581" text-anchor="middle" fill="#8b949e" font-size="10">Vision into precise</text>
  <text x="530" y="594" text-anchor="middle" fill="#8b949e" font-size="10">specification</text>
  <rect x="568" y="547" width="24" height="14" rx="3" fill="#d29922" opacity="0.3"/>
  <text x="580" y="557" text-anchor="middle" fill="#d29922" font-size="8" font-weight="bold">AI</text>

  <!-- Directors → post comment -->
  <line x1="170" y1="603" x2="170" y2="630" stroke="#484f58" stroke-width="1"/>
  <rect x="108" y="633" width="124" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="170" y="648" text-anchor="middle" fill="#8b949e" font-size="10">Posts comment</text>

  <line x1="350" y1="603" x2="350" y2="630" stroke="#484f58" stroke-width="1"/>
  <rect x="288" y="633" width="124" height="22" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="350" y="648" text-anchor="middle" fill="#8b949e" font-size="10">Posts comment</text>

  <!-- Craftsman → Implementor (code: always triggers) -->
  <line x1="530" y1="603" x2="530" y2="670" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="544" y="613" width="38" height="14" rx="3" fill="#bc8cff" opacity="0.2"/>
  <text x="563" y="623" text-anchor="middle" fill="#bc8cff" font-size="8" font-weight="bold">CODE</text>
  <text x="544" y="640" fill="#bc8cff" font-size="9" font-style="italic">always</text>
  <text x="544" y="652" fill="#bc8cff" font-size="9" font-style="italic">triggers</text>

  <!-- ================================================================== -->
  <!-- IMPLEMENTOR -->
  <!-- ================================================================== -->
  <rect x="200" y="680" width="300" height="80" rx="25" fill="#0f2918" stroke="#3fb950" stroke-width="2"/>
  <text x="350" y="706" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Implementor</text>
  <text x="350" y="722" text-anchor="middle" fill="#8b949e" font-size="10">Writes C# code, renders GIF, retries on error</text>
  <text x="350" y="736" text-anchor="middle" fill="#8b949e" font-size="10">Posts code + preview + summary as comment</text>
  <text x="350" y="750" text-anchor="middle" fill="#484f58" font-size="9" font-style="italic">Craftsman spec embedded as collapsed block</text>
  <!-- Badges -->
  <rect x="462" y="682" width="24" height="14" rx="3" fill="#d29922" opacity="0.3"/>
  <text x="474" y="692" text-anchor="middle" fill="#d29922" font-size="8" font-weight="bold">AI</text>
  <rect x="420" y="682" width="38" height="14" rx="3" fill="#bc8cff" opacity="0.2"/>
  <text x="439" y="692" text-anchor="middle" fill="#bc8cff" font-size="8" font-weight="bold">CODE</text>

  <!-- Craftsman line connects -->
  <line x1="530" y1="670" x2="500" y2="680" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- ================================================================== -->
  <!-- GITHUB STATE -->
  <!-- ================================================================== -->
  <line x1="350" y1="760" x2="350" y2="795" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="210" y="800" width="280" height="38" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="350" y="819" text-anchor="middle" fill="#c9d1d9" font-size="12">Comment posted to GitHub Issue</text>
  <text x="350" y="832" text-anchor="middle" fill="#484f58" font-size="10">Single source of truth</text>

  <!-- ================================================================== -->
  <!-- LOOP BACK ARROW -->
  <!-- ================================================================== -->
  <path d="M 210 819 L 100 819 Q 85 819 85 804 L 85 472 Q 85 462 100 462 L 270 462"
        fill="none" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#arrow)"/>
  <text x="82" y="645" fill="#484f58" font-size="10" transform="rotate(-90,82,645)" text-anchor="middle">re-fetch &amp; re-triage</text>

  <!-- ================================================================== -->
  <!-- SUMMARY BOX -->
  <!-- ================================================================== -->
  <rect x="100" y="960" width="520" height="240" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <text x="360" y="990" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">What decides what?</text>

  <!-- AI -->
  <rect x="125" y="1010" width="24" height="14" rx="3" fill="#d29922" opacity="0.3"/>
  <text x="137" y="1020" text-anchor="middle" fill="#d29922" font-size="8" font-weight="bold">AI</text>
  <text x="158" y="1020" fill="#d29922" font-size="11" font-weight="bold">AI decides:</text>
  <text x="158" y="1038" fill="#8b949e" font-size="10">Safety classification (safe pixogram request?)</text>
  <text x="158" y="1054" fill="#8b949e" font-size="10">Triage (who acts next?), creative direction, C# code generation</text>

  <!-- Code -->
  <rect x="125" y="1078" width="38" height="14" rx="3" fill="#bc8cff" opacity="0.2"/>
  <text x="144" y="1088" text-anchor="middle" fill="#bc8cff" font-size="8" font-weight="bold">CODE</text>
  <text x="172" y="1088" fill="#bc8cff" font-size="11" font-weight="bold">Workflow decides:</text>
  <text x="172" y="1106" fill="#8b949e" font-size="10">Approval gate (admin auto-approve, label check)</text>
  <text x="172" y="1122" fill="#8b949e" font-size="10">Safety label caching (skip AI if already classified)</text>
  <text x="172" y="1138" fill="#8b949e" font-size="10">Craftsman always triggers Implementor, GIF rendering &amp; upload</text>

  <!-- State -->
  <circle cx="133" cy="1168" r="6" fill="#58a6ff"/>
  <text x="148" y="1172" fill="#58a6ff" font-size="11" font-weight="bold">State:</text>
  <text x="198" y="1172" fill="#8b949e" font-size="10">GitHub Issue + Comments = single source of truth</text>

</svg>
</body>
</html>
