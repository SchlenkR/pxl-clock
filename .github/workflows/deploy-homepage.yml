name: Deploy homepage

on:
  push:
    branches: [main]
    paths:
      - 'homepage/**'
      - '.github/workflows/deploy-homepage.yml'
  # Rebuild whenever an issue or its comments change so the homepage reflects
  # new/edited pixogram ideas + feedback in near-real-time. GitHub does not
  # expose a "body-only edited" event — `issues: edited` fires on any change
  # to the issue (title/body/assignees), which is fine: the fetch step only
  # pulls pixogram-idea-labelled issues so irrelevant edits cost ~30s but
  # don't pollute output.
  issues:
    types: [opened, edited, reopened, closed, deleted, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  # Safety net: rebuild every 30 minutes even if no event fired.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homepage
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: homepage/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step runs `pnpm run fetch && vite build`. Fetch scans GitHub issues +
      # the pixogram-maker branch for all rendered artefacts, writes src/data.json,
      # then Vite bundles everything into dist/.
      - name: Fetch GitHub data + build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: homepage/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
