name: Pixogram Triage (disabled — replaced by pixogram-workflow.yml)

on:
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build pixogram-maker
        run: dotnet build pixogram-maker/src/pixograms

      - name: Triage untriaged issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ADMIN: ${{ vars.ADMIN || 'SchlenkR' }}
        run: dotnet run --project pixogram-maker/src/pixograms --no-build -- triage-all
