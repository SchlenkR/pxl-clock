name: Discover Community Pixograms

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  search:
    name: Search for Pixograms
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.search.outputs.results }}
    permissions:
      contents: read
    steps:
      - name: Search GitHub for Pxl package references
        id: search
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Search for C# files using the Pxl.Ui.CSharp API (the PXL Clock drawing namespace)
          # Exclude our own repos from results
          # Include forks (fork:true) since community members may fork pxl-clock
          QUERY='"Pxl.Ui.CSharp" language:csharp fork:true -repo:${{ github.repository }} -repo:CuminAndPotato/pxl-software -repo:SchlenkR/pxl-vscode-extension'

          RESPONSE=$(gh api search/code \
            --method GET \
            -f "q=${QUERY}" \
            -f "per_page=100" \
            --jq '{
              total_count: .total_count,
              items: [.items[] | {
                repo: .repository.full_name,
                repo_url: .repository.html_url,
                file: .name,
                file_url: .html_url,
                repo_description: .repository.description
              }]
            }' 2>&1) || true

          # Deduplicate by repo
          REPOS=$(echo "$RESPONSE" | jq -c '{
            total_count: .total_count,
            repos: [.items | group_by(.repo)[] | {
              name: .[0].repo,
              url: .[0].repo_url,
              description: .[0].repo_description,
              files: [.[] | {name: .file, url: .file_url}]
            }]
          }')

          echo "results<<RESULTS_EOF" >> "$GITHUB_OUTPUT"
          echo "$REPOS" >> "$GITHUB_OUTPUT"
          echo "RESULTS_EOF" >> "$GITHUB_OUTPUT"

  update-issue:
    name: Update Tracking Issue
    runs-on: ubuntu-latest
    needs: search
    permissions:
      issues: write
    steps:
      - name: Create or update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: ${{ needs.search.outputs.results }}
        run: |
          REPO_COUNT=$(echo "$RESULTS" | jq '.repos | length')
          TOTAL_FILES=$(echo "$RESULTS" | jq '.total_count')
          TODAY=$(date -u +%Y-%m-%d)

          # Build issue body using a temp file to avoid subshell variable scoping issues
          BODY_FILE=$(mktemp)

          cat >> "$BODY_FILE" <<HEADER
          ## Community Pixograms Discovery Report

          **Last scan:** ${TODAY}
          **Repos found:** ${REPO_COUNT}
          **Total files:** ${TOTAL_FILES}

          ---
          HEADER

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' "$BODY_FILE"

          if [ "$REPO_COUNT" -eq 0 ]; then
            echo "" >> "$BODY_FILE"
            echo "No community pixograms found yet. When someone creates a pixogram using the [Pxl NuGet package](https://www.nuget.org/packages/Pxl), it will appear here automatically." >> "$BODY_FILE"
          else
            echo "" >> "$BODY_FILE"
            echo "### Found Repositories" >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"

            # Use process substitution instead of pipe to avoid subshell
            while read -r repo; do
              REPO_NAME=$(echo "$repo" | jq -r '.name')
              REPO_URL=$(echo "$repo" | jq -r '.url')
              REPO_DESC=$(echo "$repo" | jq -r '.description // "No description"')
              FILE_COUNT=$(echo "$repo" | jq '.files | length')

              echo "#### [${REPO_NAME}](${REPO_URL})" >> "$BODY_FILE"
              echo "> ${REPO_DESC}" >> "$BODY_FILE"
              echo "" >> "$BODY_FILE"
              echo "| File | Link |" >> "$BODY_FILE"
              echo "|------|------|" >> "$BODY_FILE"

              while read -r file; do
                FILE_NAME=$(echo "$file" | jq -r '.name')
                FILE_URL=$(echo "$file" | jq -r '.url')
                echo "| ${FILE_NAME} | [View](${FILE_URL}) |" >> "$BODY_FILE"
              done < <(echo "$repo" | jq -c '.files[]')

              echo "" >> "$BODY_FILE"
            done < <(echo "$RESULTS" | jq -c '.repos[]')
          fi

          echo "" >> "$BODY_FILE"
          echo "---" >> "$BODY_FILE"
          echo "*This issue is automatically updated daily by the [Discover Pixograms workflow](https://github.com/${{ github.repository }}/actions/workflows/discover-pixograms.yml).*" >> "$BODY_FILE"

          ISSUE_TITLE="Community Pixograms Tracker"

          # Find existing issue by title
          EXISTING_ISSUE=$(gh issue list \
            --repo "${{ github.repository }}" \
            --search "in:title ${ISSUE_TITLE}" \
            --state open \
            --json number,title \
            --jq "[.[] | select(.title == \"${ISSUE_TITLE}\")] | .[0].number // empty")

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue edit "$EXISTING_ISSUE" \
              --repo "${{ github.repository }}" \
              --body-file "$BODY_FILE"
            echo "Updated issue #${EXISTING_ISSUE}"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${ISSUE_TITLE}" \
              --body-file "$BODY_FILE"
            echo "Created new tracking issue"
          fi

          rm -f "$BODY_FILE"
