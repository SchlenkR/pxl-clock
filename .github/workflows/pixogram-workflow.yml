name: Pixogram Workflow
run-name: "PIXOGRAM · ${{ github.event.issue.number && format('#{0}', github.event.issue.number) || github.event.inputs.issue_number && format('#{0}', github.event.inputs.issue_number) || 'dispatch' }} · via ${{ github.event_name }}"

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number (leave empty to dispatch all)'
        required: false
        type: string

permissions:
  issues: write
  contents: write

jobs:
  run:
    # Skip bot comments (github-actions posts pipeline results → would cause infinite loop)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pixogram-workflow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        run: npm i -g @github/copilot

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Pxl.Render
        run: dotnet tool install --global Pxl.Render

      - name: Build
        run: dotnet build pixogram-maker/src/pixograms

      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OLLAMA1_URL: ${{ secrets.OLLAMA1_URL }}
          OLLAMA1_API_KEY: ${{ secrets.OLLAMA1_API_KEY }}
          MAINTAINERS: ${{ vars.MAINTAINERS }}
          TRUSTED_AUTHORS: ${{ vars.TRUSTED_AUTHORS }}
          DEFAULT_ITERATIONS: ${{ vars.DEFAULT_ITERATIONS }}
          MAX_ITERATIONS_CAP: ${{ vars.MAX_ITERATIONS_CAP }}
          MAX_DIRECTOR_RETRIES: ${{ vars.MAX_DIRECTOR_RETRIES }}
          MAX_IMPLEMENTOR_RETRIES: ${{ vars.MAX_IMPLEMENTOR_RETRIES }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
          GIF_DURATION_SECONDS: ${{ vars.GIF_DURATION_SECONDS }}
          GIF_SCALE: ${{ vars.GIF_SCALE }}
          CONFIG_SET: ${{ vars.CONFIG_SET }}
        run: |
          ISSUE="${{ github.event.issue.number || github.event.inputs.issue_number }}"
          if [ -n "$ISSUE" ]; then
            dotnet run --project pixogram-maker/src/pixograms --no-build -- workflow "$ISSUE"
          else
            dotnet run --project pixogram-maker/src/pixograms --no-build -- dispatch-and-run
          fi
