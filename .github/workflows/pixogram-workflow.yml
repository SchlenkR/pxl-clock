name: Pixogram Workflow

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number (leave empty to process all open issues)'
        required: false
        type: string

concurrency:
  group: pixogram-${{ github.event.inputs.issue_number || 'all' }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: write

jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies for Pxl.Render (SkiaSharp)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libfreetype6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Pxl.Render
        run: dotnet tool install --global Pxl.Render

      - name: Build pixogram-maker
        run: dotnet build pixogram-maker/src/pixograms

      - name: Run workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ADMIN: ${{ vars.ADMIN || 'SchlenkR' }}
        run: |
          ISSUE="${{ github.event.inputs.issue_number }}"
          if [ -n "$ISSUE" ]; then
            echo "Running workflow on issue #$ISSUE..."
            dotnet run --project pixogram-maker/src/pixograms --no-build -- workflow "$ISSUE"
          else
            echo "Running workflow on all eligible issues..."
            dotnet run --project pixogram-maker/src/pixograms --no-build -- workflow-all
          fi
