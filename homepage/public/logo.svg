<?xml version="1.0" encoding="UTF-8"?>
<!-- PXL monochrome pixel logo. 15 cols × 5 rows; 10px grid step,
     8px solid pixel with 1px padding on each side → visible white
     gaps between pixel cells (matches the original brand logo). -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 150 50"
     fill="#f0f0f0"
     shape-rendering="crispEdges"
     role="img"
     aria-label="PXL">
  <!-- P (cols 0-3) -->
  <rect x="1"  y="1"  width="8" height="8"/>
  <rect x="11" y="1"  width="8" height="8"/>
  <rect x="21" y="1"  width="8" height="8"/>
  <rect x="31" y="1"  width="8" height="8"/>
  <rect x="1"  y="11" width="8" height="8"/>
  <rect x="31" y="11" width="8" height="8"/>
  <rect x="1"  y="21" width="8" height="8"/>
  <rect x="11" y="21" width="8" height="8"/>
  <rect x="21" y="21" width="8" height="8"/>
  <rect x="31" y="21" width="8" height="8"/>
  <rect x="1"  y="31" width="8" height="8"/>
  <rect x="1"  y="41" width="8" height="8"/>

  <!-- X (cols 5-9) -->
  <rect x="51" y="1"  width="8" height="8"/>
  <rect x="91" y="1"  width="8" height="8"/>
  <rect x="61" y="11" width="8" height="8"/>
  <rect x="81" y="11" width="8" height="8"/>
  <rect x="71" y="21" width="8" height="8"/>
  <rect x="61" y="31" width="8" height="8"/>
  <rect x="81" y="31" width="8" height="8"/>
  <rect x="51" y="41" width="8" height="8"/>
  <rect x="91" y="41" width="8" height="8"/>

  <!-- L (cols 11-14) -->
  <rect x="111" y="1"  width="8" height="8"/>
  <rect x="111" y="11" width="8" height="8"/>
  <rect x="111" y="21" width="8" height="8"/>
  <rect x="111" y="31" width="8" height="8"/>
  <rect x="111" y="41" width="8" height="8"/>
  <rect x="121" y="41" width="8" height="8"/>
  <rect x="131" y="41" width="8" height="8"/>
  <rect x="141" y="41" width="8" height="8"/>
</svg>
